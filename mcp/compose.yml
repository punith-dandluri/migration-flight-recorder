name: migration-flight-recorder-inspection
services:
  postgres-mcp:
    image: crystaldba/postgres-mcp@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
    environment:
      DATABASE_URI: ${PRIMARY_DATABASE_URI:?Run npm run setup:inspection first}
    command:
      [
        "--access-mode=restricted",
        "--transport=sse",
        "--sse-host=0.0.0.0",
        "--sse-port=8000",
      ]
    ports: ["127.0.0.1:8001:8000"]
    restart: unless-stopped
  postgres-mcp-secondary:
    image: crystaldba/postgres-mcp@sha256:dbbd346860d29f1543e991f30f3284bf4ab5f096d049ecc3426528f20b1b6e6b
    environment:
      DATABASE_URI: ${SECONDARY_DATABASE_URI:?Run npm run setup:inspection first}
    command:
      [
        "--access-mode=restricted",
        "--transport=sse",
        "--sse-host=0.0.0.0",
        "--sse-port=8000",
      ]
    ports: ["127.0.0.1:8002:8000"]
    restart: unless-stopped
