name: migration-flight-recorder-db
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: migration-flight-recorder-postgres
    environment:
      POSTGRES_DB: migration_flight_recorder
      POSTGRES_USER: migration_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local first}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - migration-flight-recorder-db-data:/var/lib/postgresql/data
      - ./migrations/000_baseline.sql:/docker-entrypoint-initdb.d/000_baseline.sql:ro
      - ./seeds/001_production_like_data.sql:/docker-entrypoint-initdb.d/001_production_like_data.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U migration_agent -d migration_flight_recorder",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  migration-flight-recorder-db-data:
